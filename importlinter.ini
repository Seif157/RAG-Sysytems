; Layering contracts enforcing the Dependency Rule.
;
; These contracts are executable architecture. They run in CI and in `make test`;
; a violation fails the build. Layering that is only documented is layering that
; will erode (ADR-001).
;
; Run with:  lint-imports --config importlinter.ini

[importlinter]
root_package = rag
include_external_packages = True


; --------------------------------------------------------------------------- ;
; 1. The core layering: dependencies point inward only.
; --------------------------------------------------------------------------- ;
[importlinter:contract:1]
name = Clean Architecture layers (presentation -> application -> domain)
type = layers
layers =
    rag.presentation
    rag.application
    rag.domain


; --------------------------------------------------------------------------- ;
; 2. The domain is the centre: it depends on nothing.
; --------------------------------------------------------------------------- ;
[importlinter:contract:2]
name = Domain depends on no other layer
type = forbidden
source_modules =
    rag.domain
forbidden_modules =
    rag.application
    rag.presentation
    rag.infrastructure
    rag.core
    rag.config


; --------------------------------------------------------------------------- ;
; 3. The domain imports no third-party package.
;
;    The moment the domain imports pydantic, Qdrant or LlamaIndex, the core is
;    coupled to a release cycle it does not control. The prototype broke exactly
;    this way when LlamaIndex removed ServiceContext (ADR-002).
; --------------------------------------------------------------------------- ;
[importlinter:contract:3]
name = Domain imports no third-party package
type = forbidden
source_modules =
    rag.domain
forbidden_modules =
    pydantic
    pydantic_settings
    structlog
    streamlit
    qdrant_client
    llama_index
    openai
    google
    anthropic
    httpx
    requests


; --------------------------------------------------------------------------- ;
; 4. Use cases must be executable against in-memory doubles, with zero network.
; --------------------------------------------------------------------------- ;
[importlinter:contract:4]
name = Application does not depend on infrastructure, presentation or config
type = forbidden
source_modules =
    rag.application
forbidden_modules =
    rag.infrastructure
    rag.presentation
    rag.config
allow_indirect_imports = True


[importlinter:contract:5]
name = Application imports no vendor SDK
type = forbidden
source_modules =
    rag.application
forbidden_modules =
    qdrant_client
    llama_index
    openai
    google
    anthropic
    streamlit
allow_indirect_imports = True


; --------------------------------------------------------------------------- ;
; 6. The Streamlit UI must not know that Qdrant exists. It resolves use cases
;    from the composition root; reaching infrastructure through core is the
;    intended path, reaching it directly is not.
; --------------------------------------------------------------------------- ;
[importlinter:contract:6]
name = Presentation does not import infrastructure directly
type = forbidden
source_modules =
    rag.presentation
forbidden_modules =
    rag.infrastructure
allow_indirect_imports = True


; --------------------------------------------------------------------------- ;
; 7. Adapters implement ports; they never reach back into orchestration.
; --------------------------------------------------------------------------- ;
[importlinter:contract:7]
name = Infrastructure does not depend on application or presentation
type = forbidden
source_modules =
    rag.infrastructure
forbidden_modules =
    rag.application
    rag.presentation
allow_indirect_imports = True


; --------------------------------------------------------------------------- ;
; 8. Config is a leaf. It is injected, never imported by the code it configures.
; --------------------------------------------------------------------------- ;
[importlinter:contract:8]
name = Config imports nothing from the application
type = forbidden
source_modules =
    rag.config
forbidden_modules =
    rag.domain
    rag.application
    rag.presentation
    rag.infrastructure
    rag.core


; --------------------------------------------------------------------------- ;
; 9. utils is a leaf: generic helpers only, no knowledge of the system.
; --------------------------------------------------------------------------- ;
[importlinter:contract:9]
name = Utils is a leaf package
type = forbidden
source_modules =
    rag.utils
forbidden_modules =
    rag.domain
    rag.application
    rag.presentation
    rag.infrastructure
    rag.core
    rag.config
