# Qdrant, for local development.
#
# The only infrastructure this project needs. Original uploads live in a local
# folder and document state lives in the chunk payloads, so there is no database
# and no broker to run.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag-qdrant
    ports:
      - "127.0.0.1:6333:6333" # REST, local development only
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant-data:
